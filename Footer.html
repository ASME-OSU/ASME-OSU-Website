<!-- V11 interactions script -->
<script>
(function () {
  document.addEventListener('DOMContentLoaded', function () {
    var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    /* ─────────────────────────────────────────
       1. GALLERY ORIENTATION CLASSES
    ───────────────────────────────────────── */
    document.querySelectorAll('.asme-gallery-page .gallery-item img, .gallery .gallery-item img').forEach(function (img) {
      function classifyImage() {
        var item = img.closest('.gallery-item');
        if (!item || !img.naturalWidth || !img.naturalHeight) return;
        var ratio = img.naturalWidth / img.naturalHeight;
        item.classList.remove('is-portrait', 'is-landscape', 'is-panorama', 'is-square');
        if (ratio >= 1.75) item.classList.add('is-panorama');
        else if (ratio >= 1.15) item.classList.add('is-landscape');
        else if (ratio <= 0.85) item.classList.add('is-portrait');
        else item.classList.add('is-square');
      }
      if (img.complete) classifyImage();
      else img.addEventListener('load', classifyImage);
    });

    /* ─────────────────────────────────────────
       2. HERO TEXT STAGGER (homepage load)
    ───────────────────────────────────────── */
    var heroStaggerSelectors = [
      '.ah-eyebrow',
      '.ah-title',
      '.ah-sub',
      '.ah-btns',
      '.ah-stats',
      '.ah-badge'
    ];

    if (!reduceMotion) {
      heroStaggerSelectors.forEach(function (selector, i) {
        var el = document.querySelector(selector);
        if (!el) return;
        el.style.opacity = '0';
        el.style.transform = 'translateY(18px)';
        el.style.transition = 'opacity 0.55s ease, transform 0.55s ease';
        el.style.transitionDelay = (i * 110) + 'ms';
        setTimeout(function () {
          el.style.opacity = '1';
          el.style.transform = 'translateY(0)';
        }, 80 + i * 110);
      });
    }

    /* ─────────────────────────────────────────
       3. SCROLL REVEAL — expanded targets
    ───────────────────────────────────────── */
    var revealTargets = document.querySelectorAll([
      '.ah-about',
      '.ah-section-title',
      '.ah-card',
      '.ah-featured-event',
      '.ah-about-impact',
      '.ah-calendar-section',
      '.about-hero',
      '.about-mission',
      '.about-pillar',
      '.about-stats-strip',
      '.about-award',
      '.about-history',
      '.about-cta-section',
      '.asme-join-page .join-hero-copy',
      '.asme-join-page .join-form-card',
      '.join-faq-section',
      '.join-faq-item',
      '.sponsors-hero',
      '.sponsor-card',
      '.sponsors-cta',
      '.sponsor-hero',
      '.sponsor-section',
      '.sponsor-contact',
      '.gallery-hero',
      '.asme-gallery-page .gallery-item',
      '.leadership-year',
      '.leader-card',
      '.acp-header',
      '.acp-cal-card',
      '.acp-info-item',
      '.blog article',
      '.archive article',
      '.search article',
      '#secondary .widget',
      '.asme-footer-col'
    ].join(','));

    /* Smarter stagger — resets per parent so sibling cards cascade nicely */
    var parentCounters = new Map();
    revealTargets.forEach(function (el) {
      var parent = el.parentElement;
      var count = parentCounters.get(parent) || 0;
      parentCounters.set(parent, count + 1);
      el.classList.add('asme-animate', 'asme-reveal');
      el.style.setProperty('--asme-delay', Math.min(count * 70, 350) + 'ms');
    });

    if (reduceMotion) {
      revealTargets.forEach(function (el) { el.classList.add('is-visible'); });
    } else if ('IntersectionObserver' in window) {
      var observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (entry.isIntersecting) {
            entry.target.classList.add('is-visible');
            observer.unobserve(entry.target);
          }
        });
      }, { threshold: 0.1, rootMargin: '0px 0px -48px 0px' });
      revealTargets.forEach(function (el) { observer.observe(el); });
    }

    /* ─────────────────────────────────────────
       4. COUNT-UP ANIMATION
    ───────────────────────────────────────── */
    function countUp(el, target, suffix, duration) {
      var start = null;
      function step(ts) {
        if (!start) start = ts;
        var progress = Math.min((ts - start) / duration, 1);
        var eased = 1 - Math.pow(1 - progress, 3);
        el.textContent = Math.floor(eased * target) + suffix;
        if (progress < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
    }

    /* Homepage impact mini stat cards */
    var impactGrid = document.querySelector('.ah-about-impact');
    if (impactGrid && !reduceMotion && 'IntersectionObserver' in window) {
      var homeCountTriggered = false;
      var homeCountObserver = new IntersectionObserver(function (entries) {
        if (entries[0].isIntersecting && !homeCountTriggered) {
          homeCountTriggered = true;
          homeCountObserver.disconnect();
          document.querySelectorAll('.ah-impact-mini span').forEach(function (el) {
            var raw = el.textContent.trim();
            var suffix = raw.replace(/[0-9]/g, '');
            var target = parseInt(raw.replace(/\D/g, ''), 10);
            if (!isNaN(target) && target > 0) {
              el.textContent = '0' + suffix;
              countUp(el, target, suffix, 1200);
            }
          });
        }
      }, { threshold: 0.5 });
      homeCountObserver.observe(impactGrid);
    }

    /* Sponsor page stat panel */
    var panel = document.querySelector('.sponsor-hero-panel');
    if (panel && !reduceMotion && 'IntersectionObserver' in window) {
      var sponsorCountTriggered = false;
      var sponsorCountObserver = new IntersectionObserver(function (entries) {
        if (entries[0].isIntersecting && !sponsorCountTriggered) {
          sponsorCountTriggered = true;
          sponsorCountObserver.disconnect();
          document.querySelectorAll('.sponsor-stat-inner strong').forEach(function (el) {
            var raw = el.textContent.trim();
            var suffix = raw.replace(/[0-9]/g, '');
            var target = parseInt(raw.replace(/\D/g, ''), 10);
            if (!isNaN(target)) {
              el.textContent = '0' + suffix;
              countUp(el, target, suffix, 1500);
            }
          });
        }
      }, { threshold: 0.45 });
      sponsorCountObserver.observe(panel);
    }

    /* Card hover motion is owned by the shared CSS motion system. */

    /* ─────────────────────────────────────────
       6. SMOOTH SCROLL for anchor links
    ───────────────────────────────────────── */
    document.querySelectorAll('a[href^="#"]').forEach(function (link) {
      link.addEventListener('click', function (e) {
        var target = document.querySelector(link.getAttribute('href'));
        if (!target) return;
        e.preventDefault();
        target.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', block: 'start' });
      });
    });

    /* ─────────────────────────────────────────
       7. HOME HERO SLIDESHOW
    ───────────────────────────────────────── */
    var ahSlides = [
      { url: 'https://org.osu.edu/asme/files/2024/02/FallCareerFair_2.HEIC_-0de7b12be03c2f6b.png', focus: 'center 37%' },
      { url: 'https://org.osu.edu/asme/files/2024/02/SpringCareerFair2024_2-583e2a7ffea08f33.png', focus: 'center 50%' },
      { url: 'https://org.osu.edu/asme/files/2024/03/MicrosoftTeams-image-84f8ac384c4c262e.jpg',   focus: 'center center' },
      { url: 'https://org.osu.edu/asme/files/2026/04/ASME_Barsocial_2025-e1777080033405.jpg',      focus: 'center 30%' }
    ];

    var container     = document.getElementById('ahSlides');
    var dotsContainer = document.getElementById('ahDots');

    if (container && dotsContainer && ahSlides.length) {
      var current = 0;
      var slides  = [];
      var dots    = [];
      var timer   = null;

      ahSlides.forEach(function (s, i) {
        var el = document.createElement('div');
        el.className = 'ah-hero-slide';
        el.style.backgroundImage   = 'url(' + s.url + ')';
        el.style.backgroundPosition = s.focus || 'center center';
        if (i === 0) el.classList.add('active');
        container.appendChild(el);
        slides.push(el);

        var dot = document.createElement('button');
        dot.className = 'ah-hero-dot' + (i === 0 ? ' active' : '');
        dot.type = 'button';
        dot.setAttribute('aria-label', 'Show slide ' + (i + 1));
        dot.addEventListener('click', function () { goTo(i); restartTimer(); });
        dotsContainer.appendChild(dot);
        dots.push(dot);
      });

      function goTo(n) {
        slides[current].classList.remove('active');
        dots[current].classList.remove('active');
        current = (n + slides.length) % slides.length;
        slides[current].classList.add('active');
        dots[current].classList.add('active');
      }

      function restartTimer() {
        if (timer) clearInterval(timer);
        if (!reduceMotion) {
          timer = setInterval(function () {
            if (!document.hidden) goTo(current + 1);
          }, 5000);
        }
      }

      restartTimer();
    }

    /* ─────────────────────────────────────────
       8. GALLERY LIGHTBOX
    ───────────────────────────────────────── */
    (function () {
      var galleryItems = Array.prototype.slice.call(document.querySelectorAll([
        '.asme-gallery-page .gallery-item a',
        '.asme-gallery-page .gallery-icon a',
        '.gallery .gallery-item a',
        '.gallery .gallery-icon a',
        '.wp-block-gallery a[href]',
        '.wp-block-image a[href]'
      ].join(','))).filter(function (link) {
        var href = link.getAttribute('href') || '';
        var hasImage = !!link.querySelector('img');
        var isImageFile = /\.(jpe?g|png|gif|webp|avif|heic)(\?.*)?$/i.test(href);
        return hasImage && isImageFile;
      });

      if (!galleryItems.length) return;

      var lightbox = document.createElement('div');
      lightbox.className = 'asme-lightbox';
      lightbox.setAttribute('role', 'dialog');
      lightbox.setAttribute('aria-modal', 'true');
      lightbox.setAttribute('aria-label', 'Gallery image viewer');
      lightbox.innerHTML =
        '<button class="asme-lightbox-close" aria-label="Close">&times;</button>' +
        '<button class="asme-lightbox-prev" aria-label="Previous">&lsaquo;</button>' +
        '<button class="asme-lightbox-next" aria-label="Next">&rsaquo;</button>' +
        '<div class="asme-lightbox-content">' +
          '<img src="" alt="Gallery Image" decoding="async">' +
          '<div class="asme-lightbox-bar">' +
            '<div class="asme-lightbox-caption"></div>' +
            '<div class="asme-lightbox-actions">' +
              '<a class="asme-lightbox-download" href="#" download>Download</a>' +
              '<a class="asme-lightbox-open" href="#" target="_blank" rel="noopener">Open</a>' +
            '</div>' +
          '</div>' +
        '</div>';
      document.body.appendChild(lightbox);

      var img          = lightbox.querySelector('img');
      var caption      = lightbox.querySelector('.asme-lightbox-caption');
      var downloadLink = lightbox.querySelector('.asme-lightbox-download');
      var openLink     = lightbox.querySelector('.asme-lightbox-open');
      var prevBtn      = lightbox.querySelector('.asme-lightbox-prev');
      var nextBtn      = lightbox.querySelector('.asme-lightbox-next');
      var closeBtn     = lightbox.querySelector('.asme-lightbox-close');
      var contentPanel = lightbox.querySelector('.asme-lightbox-content');
      var currentIndex = 0;
      var imageRequestId = 0;

      function updateImage(index, direction) {
        if (index < 0 || index >= galleryItems.length) return;
        currentIndex = index;
        var requestId  = ++imageRequestId;
        var link       = galleryItems[currentIndex];
        var imgUrl     = link.getAttribute('href');
        var originalImg = link.querySelector('img');
        var altText    = originalImg ? originalImg.getAttribute('alt') : 'ASME Gallery Image';
        var filename   = (imgUrl.split('/').pop() || 'asme-gallery-image').split('?')[0];
        var preloader  = new Image();
        var shouldTransition = !reduceMotion && Boolean(direction) && lightbox.classList.contains('active');

        if (shouldTransition) {
          contentPanel.style.setProperty('--asme-lightbox-shift', direction > 0 ? '16px' : '-16px');
          contentPanel.style.setProperty('--asme-lightbox-exit-shift', direction > 0 ? '-10px' : '10px');
          contentPanel.classList.remove('is-entering');
          contentPanel.classList.add('is-switching');
        }

        lightbox.setAttribute('aria-busy', 'true');

        function commitImage() {
          if (requestId !== imageRequestId) return;
          function swapImage() {
            if (requestId !== imageRequestId) return;
            if (shouldTransition) {
              contentPanel.classList.remove('is-switching');
              contentPanel.classList.add('is-entering');
            }
            img.src             = imgUrl;
            img.alt             = altText || 'ASME Gallery Image';
            caption.textContent = altText || '';
            downloadLink.href   = imgUrl;
            downloadLink.setAttribute('download', filename);
            openLink.href       = imgUrl;
            lightbox.setAttribute('aria-busy', 'false');
            if (shouldTransition) {
              window.requestAnimationFrame(function () {
                window.requestAnimationFrame(function () { contentPanel.classList.remove('is-entering'); });
              });
            }
          }
          if (shouldTransition) window.setTimeout(swapImage, 120);
          else swapImage();
        }

        preloader.onload = function () {
          if (typeof preloader.decode === 'function') {
            preloader.decode().catch(function () {}).then(commitImage);
          } else {
            commitImage();
          }
        };

        preloader.onerror = function () {
          if (requestId === imageRequestId) {
            lightbox.setAttribute('aria-busy', 'false');
          }
        };

        preloader.src = imgUrl;
      }

      galleryItems.forEach(function (link, index) {
        link.addEventListener('click', function (e) {
          e.preventDefault();
          updateImage(index, 0);
          lightbox.classList.add('active');
          document.body.classList.add('asme-lightbox-open-body');
          closeBtn.focus();
        });
      });

      function closeLightbox() {
        lightbox.classList.remove('active');
        document.body.classList.remove('asme-lightbox-open-body');
      }

      closeBtn.addEventListener('click', closeLightbox);
      lightbox.addEventListener('click', function (e) {
        if (e.target === lightbox) closeLightbox();
      });
      lightbox.querySelector('.asme-lightbox-content').addEventListener('click', function (e) {
        e.stopPropagation();
      });

      prevBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        updateImage(currentIndex - 1 < 0 ? galleryItems.length - 1 : currentIndex - 1, -1);
      });
      nextBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        updateImage(currentIndex + 1 >= galleryItems.length ? 0 : currentIndex + 1, 1);
      });

      document.addEventListener('keydown', function (e) {
        if (!lightbox.classList.contains('active')) return;
        if (e.key === 'Escape')      closeLightbox();
        else if (e.key === 'ArrowLeft')  prevBtn.click();
        else if (e.key === 'ArrowRight') nextBtn.click();
      });
    })();

  });
})();
</script>

<script>
  (function () {
    function initSponsorInquiryForm(form) {
      if (!form || form.getAttribute('data-mailto-ready') === 'true') return;
      var submitLink = form.querySelector('.sponsor-form-submit');
      if (!submitLink) return;

      form.setAttribute('data-mailto-ready', 'true');

      function findField(name) {
        return form.querySelector('[data-sponsor-field="' + name + '"]');
      }

      function getValue(name) {
        var field = findField(name);
        return field ? field.value.trim() : '';
      }

      function buildMailto() {
        var company = getValue('company');
        var contact = getValue('contact');
        var email = getValue('email');
        var tierField = findField('tier');
        var tier = tierField ? tierField.value : '';
        var message = getValue('message');

        var subject = encodeURIComponent('ASME OSU Sponsorship Inquiry' + (tier ? ' - ' + tier : '') + (company ? ' | ' + company : ''));
        var body = encodeURIComponent(
          'Hi ASME OSU,\n\n' +
          'I am interested in sponsoring ASME OSU' + (tier ? ' at the ' + tier + ' level' : '') + '.\n\n' +
          (company ? 'Company: ' + company + '\n' : '') +
          (contact ? 'Contact: ' + contact + '\n' : '') +
          (email ? 'Reply-to: ' + email + '\n' : '') +
          (message ? '\nAdditional notes:\n' + message : '') +
          '\n\nLooking forward to hearing from you.' +
          (contact ? '\n\n' + contact : '')
        );

        return 'mailto:asme@osu.edu?subject=' + subject + '&body=' + body;
      }

      function updateSubmitLink() {
        submitLink.setAttribute('href', buildMailto());
      }

      form.addEventListener('input', updateSubmitLink);
      form.addEventListener('change', updateSubmitLink);
      submitLink.addEventListener('mousedown', updateSubmitLink);
      submitLink.addEventListener('touchstart', updateSubmitLink);
      submitLink.addEventListener('click', updateSubmitLink);

      updateSubmitLink();
    }

    function initSponsorForms() {
      var forms = document.querySelectorAll('.asme-sponsor-page [data-sponsor-form]');
      forms.forEach(initSponsorInquiryForm);
    }

    function setTier(form, tier) {
      if (!form || !tier) return;
      var tierField = form.querySelector('[data-sponsor-field="tier"]');
      if (!tierField) return;
      tierField.value = tier;
      tierField.dispatchEvent(new Event('change', { bubbles: true }));
    }

    function openSponsorModal(tier) {
      var modal = document.getElementById('sponsor-modal');
      if (!modal) return;
      var modalForm = modal.querySelector('[data-sponsor-form]');
      modal.hidden = false;
      document.documentElement.classList.add('sponsor-modal-open');
      setTier(modalForm, tier);
      var firstField = modal.querySelector('[data-sponsor-field="company"]');
      if (firstField) firstField.focus();
    }

    function closeSponsorModal() {
      var modal = document.getElementById('sponsor-modal');
      if (!modal) return;
      modal.hidden = true;
      document.documentElement.classList.remove('sponsor-modal-open');
    }

    function bindSponsorModal() {
      if (document.documentElement.getAttribute('data-sponsor-modal-ready') === 'true') return;
      document.documentElement.setAttribute('data-sponsor-modal-ready', 'true');

      document.addEventListener('click', function (event) {
        var target = event.target && event.target.closest ? event.target : null;
        if (!target) return;

        var tierButton = target.closest('[data-sponsor-tier]');
        if (tierButton) {
          event.preventDefault();
          openSponsorModal(tierButton.getAttribute('data-sponsor-tier'));
          return;
        }

        if (target.closest('[data-sponsor-modal-close]')) {
          event.preventDefault();
          closeSponsorModal();
        }
      });

      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape') closeSponsorModal();
      });
    }

    function initSponsorExperience() {
      initSponsorForms();
      bindSponsorModal();
    }

    window.openSponsorModal = openSponsorModal;
    window.closeSponsorModal = closeSponsorModal;

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initSponsorExperience);
    } else {
      initSponsorExperience();
    }

    window.addEventListener('load', initSponsorExperience);
  })();
</script>

<script>
(function () {
  var directIcs = 'https://calendar.google.com/calendar/ical/c93730cdacb567b0f010d1367080e3028ec5c7657d9713b675ac9e5c437b9fba%40group.calendar.google.com/public/basic.ics';
  var cacheKey  = 'asmeFeaturedEventIcsV1';

  var fetchUrls = [
    directIcs,
    'https://api.allorigins.win/raw?url=' + encodeURIComponent(directIcs),
    'https://corsproxy.io/?' + encodeURIComponent(directIcs),
    'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(directIcs)
  ];

  var titleEl = document.getElementById('asmeFeaturedTitle');
  var descEl  = document.getElementById('asmeFeaturedDescription');
  var dateEl  = document.getElementById('asmeFeaturedDate');
  var locEl   = document.getElementById('asmeFeaturedLocation');

  if (!titleEl || !descEl || !dateEl || !locEl) return;

  function clean(value) {
    return (value || '').replace(/\\,/g, ',').replace(/\\n/g, ' ').replace(/\\\\/g, '\\').trim();
  }

  function unfold(text) { return text.replace(/\r?\n[ \t]/g, ''); }

  function getField(block, name) {
    var match = block.match(new RegExp('^' + name + '(?:;[^:]*)?:(.*)$', 'm'));
    return match ? clean(match[1]) : '';
  }

  function parseDate(raw) {
    if (!raw) return null;
    if (/^\d{8}$/.test(raw)) return new Date(Number(raw.slice(0,4)), Number(raw.slice(4,6))-1, Number(raw.slice(6,8)), 12);
    if (/^\d{8}T\d{6}$/.test(raw)) return new Date(Number(raw.slice(0,4)), Number(raw.slice(4,6))-1, Number(raw.slice(6,8)), Number(raw.slice(9,11)), Number(raw.slice(11,13)), Number(raw.slice(13,15)));
    if (/^\d{8}T\d{6}Z$/.test(raw)) return new Date(raw.slice(0,4)+'-'+raw.slice(4,6)+'-'+raw.slice(6,8)+'T'+raw.slice(9,11)+':'+raw.slice(11,13)+':'+raw.slice(13,15)+'Z');
    return null;
  }

  function getRuleValue(rule, name) {
    var match = (rule || '').match(new RegExp('(?:^|;)' + name + '=([^;]+)'));
    return match ? match[1] : '';
  }

  function getNextOccurrence(start, rule, now) {
    if (!start || start >= now) return start;
    if (!/FREQ=WEEKLY/.test(rule || '')) return start;
    var interval = parseInt(getRuleValue(rule, 'INTERVAL') || '1', 10);
    var until    = parseDate(getRuleValue(rule, 'UNTIL'));
    var next     = new Date(start.getTime());
    var stepMs   = Math.max(interval, 1) * 7 * 24 * 60 * 60 * 1000;
    while (next < now) {
      next = new Date(next.getTime() + stepMs);
      if (until && next > until) return null;
    }
    return next;
  }

  function formatDate(date, allDay) {
    return date.toLocaleDateString('en-US', { weekday: 'short', month: 'long', day: 'numeric', year: 'numeric' }) +
      (allDay ? ' · All day' : ' · ' + date.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }));
  }

  function renderFallback() {
    titleEl.textContent = 'Upcoming ASME Event';
    descEl.textContent  = 'View the full calendar for the latest ASME OSU events and updates.';
    dateEl.textContent  = 'Calendar available';
    locEl.textContent   = 'ASME OSU';
  }

  function readCachedIcs() {
    try { var c = localStorage.getItem(cacheKey); return c ? JSON.parse(c).text : ''; } catch(e) { return ''; }
  }

  function writeCachedIcs(text) {
    try { localStorage.setItem(cacheKey, JSON.stringify({ savedAt: Date.now(), text: text })); } catch(e) {}
  }

  function fetchWithTimeout(url, timeout) {
    var controller = new AbortController();
    var timer = setTimeout(function () { controller.abort(); }, timeout);
    return fetch(url, { signal: controller.signal })
      .then(function (res) {
        clearTimeout(timer);
        if (!res.ok) throw new Error('iCal request failed');
        return res.text();
      })
      .then(function (text) {
        if (!/BEGIN:VCALENDAR/i.test(text)) throw new Error('Invalid iCal response');
        return text;
      });
  }

  function fetchIcs(index) {
    if (index >= fetchUrls.length) return Promise.reject(new Error('All iCal sources failed'));
    return fetchWithTimeout(fetchUrls[index], 5500).catch(function () { return fetchIcs(index + 1); });
  }

  function renderFromIcs(text) {
    var now    = new Date();
    var blocks = unfold(text).match(/BEGIN:VEVENT[\s\S]*?END:VEVENT/g) || [];
    var events = blocks.map(function (block) {
      var rawStart  = getField(block, 'DTSTART');
      var start     = parseDate(rawStart);
      var rule      = getField(block, 'RRULE');
      var nextStart = getNextOccurrence(start, rule, now);
      return { title: getField(block, 'SUMMARY'), description: getField(block, 'DESCRIPTION'), location: getField(block, 'LOCATION'), start: nextStart, allDay: /^\d{8}$/.test(rawStart) };
    }).filter(function (e) { return e.start && e.start >= now; })
      .sort(function (a, b) { return a.start - b.start; });

    if (!events.length) { renderFallback(); return; }

    var event = events[0];
    titleEl.textContent = event.title || 'Upcoming ASME Event';
    descEl.textContent  = event.description || 'Join ASME OSU for our next chapter event. Check the full calendar for details and updates.';
    dateEl.textContent  = formatDate(event.start, event.allDay);
    locEl.textContent   = event.location || 'Location TBA';
  }

  fetchIcs(0)
    .then(function (text) { writeCachedIcs(text); renderFromIcs(text); })
    .catch(function () {
      var cached = readCachedIcs();
      if (cached) renderFromIcs(cached);
      else renderFallback();
    });
})();
</script>
