name: Publish public leaderboard rank snapshot

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write
  pages: write

concurrency:
  group: public-feed-publication
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Select the approved annual public points source
        continue-on-error: true
        run: node scripts/sync-points-source.mjs
      - name: Keep Gearly on the same approved public source
        run: node scripts/sync-gearly-points-source.mjs
      - name: Build the public comparison snapshot
        run: node scripts/publish-leaderboard-rank-snapshot.mjs
      - name: Commit a changed public snapshot
        id: publish
        run: node scripts/publish-feed.mjs "Update public leaderboard rank snapshot" data/points-source.json data/leaderboard-rank-snapshots.json assets/gearly/gearly-data.json
      - name: Request GitHub Pages source deployment
        if: steps.publish.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body --retry 3 --retry-delay 3 \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages/builds"
