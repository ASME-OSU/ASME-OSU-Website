name: Update Instagram gallery

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-instagram-gallery
  cancel-in-progress: true

jobs:
  refresh-feed:
    runs-on: ubuntu-latest
    env:
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
    steps:
      - name: Check out the website
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Refresh Instagram data
        if: env.INSTAGRAM_ACCESS_TOKEN != ''
        run: node scripts/update-instagram-feed.mjs

      - name: Explain missing configuration
        if: env.INSTAGRAM_ACCESS_TOKEN == ''
        run: echo 'Add INSTAGRAM_ACCESS_TOKEN as a repository Actions secret to enable scheduled Instagram refreshes.'

      - name: Publish an updated feed
        if: env.INSTAGRAM_ACCESS_TOKEN != ''
        run: |
          if git diff --quiet -- data/instagram-feed.json; then
            echo 'Instagram feed is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/instagram-feed.json
          git commit -m 'Update Instagram gallery feed'
          git push
