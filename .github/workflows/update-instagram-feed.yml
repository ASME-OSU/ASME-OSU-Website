name: Refresh public Instagram gallery

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-instagram-gallery
  cancel-in-progress: true

jobs:
  refresh-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the website
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Collect the public Instagram feed
        run: node scripts/scrape-instagram-feed.mjs

      - name: Publish an updated feed
        run: |
          if [ -z "$(git status --porcelain -- data/instagram-feed.json assets/gallery/instagram-auto)" ]; then
            echo 'Instagram feed is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/instagram-feed.json assets/gallery/instagram-auto
          git commit -m 'Update Instagram gallery feed'
          git push
