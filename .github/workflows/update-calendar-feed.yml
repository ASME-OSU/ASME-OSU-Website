name: Refresh public calendar feed

on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: public-feed-publication
  cancel-in-progress: false

jobs:
  refresh-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out the website
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install calendar parser
        run: npm ci

      - name: Collect public calendar events
        run: npm run sync:calendar

      - name: Publish an updated feed
        id: publish
        run: node scripts/publish-feed.mjs "Update public calendar feed" data/calendar-events.json data/calendar-history.json
      - name: Request GitHub Pages source deployment
        if: steps.publish.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body --retry 3 --retry-delay 3 \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages/builds"
