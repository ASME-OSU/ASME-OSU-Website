name: Check website changes
on:
  pull_request:
  push:
    branches: [main]
    paths-ignore: ['data/**', 'assets/gallery/instagram-auto/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: npm test
      - name: Ensure release artifacts match source
        run: git diff --exit-code -- 'ASME Custom CSS.css' releases/
