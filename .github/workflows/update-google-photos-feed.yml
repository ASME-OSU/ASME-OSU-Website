name: Refresh public Google Photos gallery

on:
  schedule:
    - cron: '37 9 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: public-feed-publication
  cancel-in-progress: false

jobs:
  refresh-feed:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - name: Install collector and image dependencies
        run: npm ci
      - name: Collect and stage a complete public album snapshot
        run: npm run sync:google-photos
      - name: Publish an updated snapshot
        id: publish
        run: node scripts/publish-feed.mjs "Update Google Photos gallery feed" data/google-photos-feed.json assets/gallery/google-photos-auto
      - name: Request GitHub Pages source deployment
        if: steps.publish.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl --fail-with-body --retry 3 --retry-delay 3 \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages/builds"
