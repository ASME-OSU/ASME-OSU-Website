<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/ASME%20Custom%20CSS.css">
  <style>
    body { margin: 0; font: 15px/1.5 Arial, sans-serif; }
    #page { padding: 16px; }
    p { margin: 0 0 1.7em; }
    .fixture-panel { margin: 16px 0; }
  </style>
</head>
<body>
  <main id="page"><div class="entry-content">
    <!-- Representative direct children captured from WordPress's wpautop output. -->
    <div class="asme-about-page fixture-panel">
      <div class="about-pillars"><div class="about-pillar">One</div><div class="about-pillar">Two</div><div class="about-pillar">Three</div><div class="about-pillar">Four</div><p></p></div>
      <div class="about-photo-strip"><figure class="about-photo">One</figure><figure class="about-photo">Two</figure><figure class="about-photo">Three</figure><p></p></div>
      <div class="about-stats-strip"><div class="about-stat-item">One</div><div class="about-stat-item">Two</div><div class="about-stat-item">Three</div><div class="about-stat-item">Four</div><p></p></div>
      <div class="about-semester-grid"><div class="about-semester-step">One</div><div class="about-semester-step">Two</div><div class="about-semester-step">Three</div><div class="about-semester-step">Four</div><p></p></div>
      <div class="about-hero-actions"><a class="about-cta-btn">One</a><br><a class="about-cta-btn">Two</a></div>
      <div class="about-cta-buttons"><a class="about-cta-btn">One</a><br><a class="about-cta-btn">Two</a></div>
    </div>
    <div class="asme-home fixture-panel"><div class="ah-cards-grid"><div class="ah-card">One</div><div class="ah-card">Two</div><div class="ah-card">Three</div><p></p></div></div>
    <div class="asme-cal-page fixture-panel"><div class="acp-info-strip"><div class="acp-info-item">One</div><div class="acp-info-item">Two</div><div class="acp-info-item">Three</div><p></p></div></div>
    <div class="asme-gallery-page fixture-panel"><div class="gallery-instagram-actions"><a class="gallery-instagram-button">One</a><br><a class="gallery-instagram-button">Two</a></div><div class="gallery-instagram-copy"><p>Copy</p><p></p></div><a class="gallery-instagram-post-card"><span class="gallery-instagram-post-image"><img alt=""><br></span><br><span class="gallery-instagram-post-copy"><strong>Fallback post</strong><br></span></a></div>
    <div class="asme-sponsor-page fixture-panel"><div class="sponsor-form-row"><div class="sponsor-form-group"><label>Label</label><br><input></div><div class="sponsor-form-group"><label>Label</label><br><input></div><p></p></div></div>
    <div class="asme-sponsors-page fixture-panel"><div class="sponsors-section-header"><h2>Heading</h2><p>Copy</p><p></p></div><div class="sponsors-tier-block--brutus"><div>Card</div><p></p></div></div>
  </div></main>
</body>
</html>
